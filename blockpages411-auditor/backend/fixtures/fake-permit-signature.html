<!doctype html>
<html>
<head><meta charset="utf-8"><title>BP411 QA Fake Permit Signature</title></head>
<body>
  <h1>QA Fixture: Fake Permit Signature</h1>
  <p>This local fixture simulates a typed-data Permit request for defensive scanner testing only.</p>
  <button id="connect">Connect Wallet</button>
  <button id="claim">Claim Allocation</button>
  <script>
    document.getElementById('connect').onclick = async () => {
      if (window.ethereum) await window.ethereum.request({ method: 'eth_requestAccounts' });
    };
    document.getElementById('claim').onclick = async () => {
      const typed = {
        types: {
          EIP712Domain: [{ name: 'name', type: 'string' }, { name: 'verifyingContract', type: 'address' }],
          Permit: [
            { name: 'owner', type: 'address' },
            { name: 'spender', type: 'address' },
            { name: 'value', type: 'uint256' },
            { name: 'nonce', type: 'uint256' },
            { name: 'deadline', type: 'uint256' }
          ]
        },
        domain: { name: 'QA Permit', verifyingContract: '0x9999999999999999999999999999999999999999' },
        primaryType: 'Permit',
        message: {
          owner: '0x3333333333333333333333333333333333333333',
          spender: '0x8888888888888888888888888888888888888888',
          value: '0xffffffffffffffffffffffffffffffffffffffffffffffffffffffffffffffff',
          nonce: '0',
          deadline: '9999999999'
        }
      };
      if (window.ethereum) await window.ethereum.request({ method: 'eth_signTypedData_v4', params: ['0x3333333333333333333333333333333333333333', JSON.stringify(typed)] });
    };
  </script>
</body>
</html>
